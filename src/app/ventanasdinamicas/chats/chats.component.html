
<div class="chats-container">

  <div class="conversaciones">
    <p>Conversaciones activas<p>
    <ul>
      <li *ngFor="let email of listaContactos">
        <button (click)="mostrarConversacion(email)">
          {{ email }}
        </button>
      </li>
    </ul>
  </div>

  <div class="mensajes">
    <p *ngIf="emailActivo">Chat con {{ emailActivo }}</p>
    
    <div class="mensajes-lista" *ngIf="conversacionActiva; else noMensajes">
      <div *ngFor="let mensaje of conversacionActiva.mensajes.slice(-5)" class="mensaje">
        <span [ngClass]="{'mensaje-enviado': mensaje.emisor === usuarioActual.email, 
                          'mensaje-recibido': mensaje.receptor === usuarioActual.email}">
          <strong>'{{ mensaje.emisor }}'</strong>
          <small>{{ mensaje.fecha }} {{ mensaje.hora }}</small>:
          {{ ' '+mensaje.mensaje }}
        </span>
      </div>
      <div class="enviar-mensaje">
        <textarea [(ngModel)]="nuevoMensaje" name="mensaje" placeholder="Escribe tu mensaje" required></textarea>
        <button (click)="sumarMensaje(emailActivo)" [disabled]="!nuevoMensaje">Enviar</button>
      </div>
      <button (click)="cerrarConversacion()">Cerrar</button>
    </div>

    <ng-template #noMensajes>
      <p>No hay mensajes para mostrar.</p>
    </ng-template>

  </div>

    <div class="nueva-conversacion" *ngIf="!conversacionActiva">
      <h2>Iniciar nueva conversación</h2>
      <form (ngSubmit)="enviarMensaje()">
        <label for="email">Email del destinatario:</label>
        <input type="email" id="email" [(ngModel)]="nuevoEmail" name="email" required />
  
        <label for="mensaje">Mensaje:</label>
        <textarea id="mensaje" [(ngModel)]="nuevoMensaje" name="mensaje" required></textarea>
  
        <button type="submit" [disabled]="!nuevoEmail || !nuevoMensaje">Enviar</button>
      </form>
    </div>
  
</div>
